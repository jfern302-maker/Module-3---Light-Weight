; PlatformIO Project Configuration File for ESP32-S3
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; S3 Specific USB Flags
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bogde/HX711 @ ^0.7.5

; Serial Monitor and Upload Port Settings
monitor_speed = 115200
upload_port = auto
monitor_port = auto
upload_protocol = esptool
